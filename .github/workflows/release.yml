name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    name: Build, Test, and Pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=moderate

      - name: Public safety
        run: npm run check:public

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

  publish:
    name: Publish to npm
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Public safety
        run: npm run check:public

      - name: Build
        run: npm run build

      - name: Check tag matches package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$version"

      - name: Check npm version is not already published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "cambrian-api-mcp@$version" version >/dev/null 2>&1; then
            echo "cambrian-api-mcp@$version is already published; refusing to republish."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: |
          node scripts/release-notes.mjs > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  registry:
    name: Publish to MCP Registry
    needs: [verify, publish]
    if: ${{ always() && needs.verify.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Validate MCP Registry metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish server.json

      - name: Verify MCP Registry publication
        run: |
          version="$(node -p "require('./server.json').version")"
          curl --fail --silent --show-error \
            "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.cambriannetwork%2Fcambrian-api/versions/$version" \
            >/dev/null
