name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=moderate

      - name: Public safety
        run: npm run check:public

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify MCP artifact
        run: |
          head -n 1 dist/index.js | grep '#!/usr/bin/env node'
          test -x dist/index.js
          node dist/index.js --version
          node --input-type=module -e "const s = await import('./dist/server.js'); const m = await import('cambrian/metadata'); const names = s.listMcpTools().map((tool) => tool.name); if (new Set(names).size !== names.length || names.includes('cambrian_health') || !names.includes('cambrian_docs') || !names.includes('cambrian_base_dexes') || !names.includes('cambrian_solana_price_current') || !m.CAMBRIAN_MCP_TOOLS.every((tool) => names.includes(tool.name))) throw new Error('Unexpected public tool inventory');"

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Submit skills.sh install event
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          refresh_dir="$(mktemp -d)"
          cd "$refresh_dir"
          npx --yes skills@latest add "$GITHUB_REPOSITORY" \
            --skill cambrian-mcp --agent codex --copy --yes
